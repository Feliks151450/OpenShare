# OpenShare Nginx 配置示例
# 静态文件由 Nginx 直接提供，API 请求反代到 Go 后端
#
# 用法：
#   1. 替换 YOUR_DOMAIN 为实际域名
#   2. 替换 /path/to/openshare/build/static 为实际静态文件路径
#   3. 确认后端端口（默认 8080）

# 站内 Markdown 图址约定 /files/<fileID>：浏览器加载图片时要交给后端重定向，
# 但地址栏导航（Accept 含 text/html）必须留给 SPA 的 /files/:fileID 详情页。
map $http_accept $file_path_is_html {
    default        0;
    "~*text/html"  1;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 有 SSL 证书时去掉上面两行，改用下面：
    # listen 443 ssl http2;
    # server_name YOUR_DOMAIN;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    root /path/to/openshare/build/static;

    # 静态文件 + SPA fallback
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（可选）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API 反代到 Go 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传大文件时调大超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 5g;
    }

    # 基于路径的下载直链反代到 Go 后端
    location /dl/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 站内 Markdown 图址 /files/<fileID>：图片请求反代给后端重定向，HTML 导航回 SPA 入口
    location ~ ^/files/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$ {
        if ($file_path_is_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
